# Mount the shipped Skill into this profile. Runtime stays on-demand
# `uvx zhihu-search`; this row does not start an MCP server.
# Loader baseUrl is the profile directory, so resolve this installed package.
- insert:
    - id: zhihu-search-skill
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: zhihu-search-skill
        includeDefaultRoots: false
        watch: false
        bundledSkillDir: !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(new URL('package.json', baseUrl)).resolve('dsh-plugin-zhihu-search/package.json')), 'skills')"
